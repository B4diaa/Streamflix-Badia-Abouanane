<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateforme de streaming</title>
    <meta name="description" content="Plateforme en ligne spécialisée en streaming : films et séries.">
</head>
<body>
    <section>

        <h1>Inscription</h1>

        <form action="">

            <label for="firstname">Entrer votre prénom :</label>
            <input type="text" name="firstname" minlength="2" maxlength="15"><br>

            <label for="lastname">Entrer votre nom :</label>
            <input type="text" name="lastname" minlength="2" maxlength="15"><br>

            <label for="email">Entrer votre email :</label>
            <input type="email" name="email" id="email"><br>

            <label for="password">Entrer votre mot de passe : </label>
            <input type="password" name="password" id="password"><br>

            <button type="submit">Inscription</button>


        </form>


    </section>
    
</body>
